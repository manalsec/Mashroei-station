<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#032f43">
<title>محطة مشروعي | وطن رقمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10.2">

<style>
/* Critical iPad header sizing — kept inline so Safari cannot use stale logo rules */
.brand-header{width:100%;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:16px!important;min-height:78px!important;padding:8px 0 10px!important}
.brand-logos{display:flex!important;align-items:center!important;gap:10px!important;min-width:0!important}
.logo-box{display:flex!important;align-items:center!important;justify-content:center!important;flex:none!important;overflow:hidden!important;border-radius:12px!important}
.logo-box.tvtc-logo{width:190px!important;height:58px!important;padding:5px 8px!important;background:#fff!important}
.logo-box.national-logo{width:112px!important;height:58px!important;padding:0!important;background:#003d3b!important}
.logo-box img{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important}
.national-group{display:flex!important;align-items:center!important;gap:8px!important;flex:none!important}
.brand-text{min-width:0!important;max-width:390px!important;text-align:right!important}
@media(max-width:1100px){.brand-header{flex-direction:column!important;align-items:stretch!important}.brand-logos{width:100%!important;justify-content:space-between!important}.brand-text{width:100%!important;max-width:none!important;text-align:center!important}.logo-box.tvtc-logo{width:180px!important;height:56px!important}.logo-box.national-logo{width:108px!important;height:56px!important}}
@media(max-width:650px){.logo-box.tvtc-logo{width:150px!important;height:48px!important}.logo-box.national-logo{width:92px!important;height:48px!important}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="app">
<header class="brand-header">
  <div class="brand-logos" aria-label="شعارات المبادرة">
    <div class="logo-box tvtc-logo"><img src="assets/tvtc.jpeg" alt="شعار المؤسسة العامة للتدريب التقني والمهني"></div>
    <div class="national-group">
      <div class="logo-box national-logo"><img src="assets/national-day.jpeg" alt="شعار اليوم الوطني السعودي"></div>
      <button id="homeButton" class="home-link" type="button" onclick="requestHome()" hidden>⌂ الرئيسية</button>
    </div>
  </div>
  <div class="brand-text"><div class="tag">مبادرة وطن رقمي <span>|</span> محطة مشروعي</div><div class="college-name">الكلية التقنية الرقمية للبنات بتبوك</div></div>
</header>
<div id="progressWrap" class="progress-wrap" hidden><div id="progressBar" class="progress-bar"></div></div>
<section id="screen" class="card" aria-live="polite"></section>
<footer>محطة مشروعي | إعداد وتقديم: منال بنت مهجع العنزي</footer>
</main>
<script src="script.js"></script>
</body>
</html>
